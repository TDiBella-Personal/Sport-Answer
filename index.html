<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is It a Sport?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a40;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --yes: #22d3a0;
      --no: #ff5c5c;
      --text: #e8e8f0;
      --muted: #7070a0;
      --glow: rgba(108, 99, 255, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* ── Animated background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .card.fade-out { opacity: 0; transform: translateY(-12px) scale(0.98); }
    .card.fade-in  { animation: fadeIn 0.35s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Intro screen ── */
    #screen-intro .activity-input-wrap {
      margin: 28px 0 24px;
    }
    #screen-intro label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    #activity-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 600;
      padding: 16px 20px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #activity-input::placeholder { color: var(--muted); font-weight: 400; }
    #activity-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }
    #activity-input.shake {
      animation: shake 0.4s ease;
      border-color: var(--no);
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .intro-desc {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── Intro button grid ── */
    .intro-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 420px) {
      .intro-btns { grid-template-columns: 1fr; }
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 16px 24px;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9b5de5);
      color: #fff;
      font-size: 1.05rem;
      box-shadow: 0 4px 24px var(--glow);
    }
    .btn-primary:hover { filter: brightness(1.12); box-shadow: 0 6px 32px var(--glow); }

    .btn-ai {
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 1.05rem;
    }
    .btn-ai:hover {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 24px var(--glow);
    }

    .answer-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 32px;
    }
    .btn-yes {
      background: linear-gradient(135deg, #22d3a0, #0aad80);
      color: #fff;
      font-size: 1.15rem;
      box-shadow: 0 4px 20px rgba(34,211,160,0.25);
    }
    .btn-yes:hover { filter: brightness(1.1); box-shadow: 0 6px 28px rgba(34,211,160,0.35); }

    .btn-no {
      background: linear-gradient(135deg, #ff5c5c, #d63031);
      color: #fff;
      font-size: 1.15rem;
      box-shadow: 0 4px 20px rgba(255,92,92,0.25);
    }
    .btn-no:hover { filter: brightness(1.1); box-shadow: 0 6px 28px rgba(255,92,92,0.35); }

    .btn-restart {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 16px;
      width: 100%;
    }
    .btn-restart:hover { background: var(--border); }

    /* ── Loading screen ── */
    #screen-loading {
      text-align: center;
      padding: 56px 36px;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .loading-activity-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }
    .loading-status {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.4em;
      transition: opacity 0.3s;
    }
    .loading-error-section {
      margin-top: 28px;
    }
    .loading-error-section p {
      color: var(--no);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .loading-error-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-bottom: 28px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .progress-track {
      background: var(--surface2);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), #9b5de5);
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 0 10px var(--glow);
    }

    /* ── Dots ── */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }
    .dot.active    { background: var(--accent); border-color: var(--accent); transform: scale(1.3); box-shadow: 0 0 8px var(--glow); }
    .dot.answered-yes { background: var(--yes); border-color: var(--yes); }
    .dot.answered-no  { background: var(--no);  border-color: var(--no); }

    /* ── Question ── */
    .q-number {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .q-text {
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
    }
    .q-icon {
      font-size: 2.8rem;
      margin-bottom: 16px;
      display: block;
    }

    /* ── Activity badge ── */
    .activity-badge {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    /* ── AI Mode badge in question screen ── */
    .ai-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(108,99,255,0.08));
      border: 1px solid rgba(108,99,255,0.45);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* ── AI Verdict reveal ── */
    .ai-verdict-section {
      margin-top: 28px;
    }
    .ai-verdict-banner {
      padding: 18px 20px;
      border-radius: 14px;
      text-align: center;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      opacity: 0;
      transform: scale(0.88);
      transition: opacity 0.35s cubic-bezier(0.34,1.56,0.64,1),
                  transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ai-verdict-banner.revealed {
      opacity: 1;
      transform: scale(1);
    }
    .ai-verdict-banner.yes-verdict {
      background: rgba(34, 211, 160, 0.1);
      border: 2px solid var(--yes);
      color: var(--yes);
    }
    .ai-verdict-banner.no-verdict {
      background: rgba(255, 92, 92, 0.1);
      border: 2px solid var(--no);
      color: var(--no);
    }
    .ai-reasoning {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
      line-height: 1.6;
      text-align: center;
      min-height: 2.8em;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .ai-reasoning.revealed { opacity: 1; }

    /* ── Verdict screen ── */
    .verdict-icon {
      font-size: 5rem;
      display: block;
      text-align: center;
      margin-bottom: 8px;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    .verdict-title {
      text-align: center;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .verdict-score {
      text-align: center;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .verdict-score strong { color: var(--text); font-size: 1.3rem; }
    .ai-credit {
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 28px;
      margin-top: 4px;
    }
    .ai-credit.hidden { display: none; }

    /* Score ring */
    .score-ring-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .score-ring {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 10; }
    .score-ring-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
    }
    .score-ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }
    .score-ring-text .big  { font-size: 2rem; line-height: 1; }
    .score-ring-text .small { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

    /* Answer breakdown */
    .breakdown {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease both;
    }
    @keyframes slideIn {
      from { opacity:0; transform: translateX(-10px); }
      to   { opacity:1; transform: translateX(0); }
    }
    .breakdown-item .bi-num  { font-size: 0.7rem; font-weight: 700; color: var(--muted); width: 16px; text-align: right; flex-shrink: 0; }
    .breakdown-item .bi-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .breakdown-item .bi-label { flex: 1; color: var(--text); line-height: 1.4; }
    .breakdown-item .bi-answer { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.04em; flex-shrink: 0; }
    .breakdown-item .bi-reasoning {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 3px;
    }
    .bi-label-wrap { flex: 1; }

    /* Verdict tiers */
    .tier-0 .verdict-title { color: var(--muted); }
    .tier-1 .verdict-title { color: var(--yes); }
    .tier-2 .verdict-title {
      background: linear-gradient(135deg, #22d3a0, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tier-3 .verdict-title {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* Confetti canvas */
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

    /* ── Utils ── */
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .answer-btns { gap: 10px; }
      .loading-error-btns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">
  <div class="header">
    <h1>Is It a Sport?</h1>
    <p>10 questions. Definitive verdict.</p>
  </div>

  <!-- ── INTRO SCREEN ── -->
  <div class="card fade-in" id="screen-intro">
    <p class="intro-desc">
      Enter any activity below. Answer the 10 questions yourself — or let Claude research it and decide.
    </p>
    <div class="activity-input-wrap">
      <label for="activity-input">What's the activity?</label>
      <input id="activity-input" type="text" placeholder="e.g. Golf, Pickleball, Chess…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="intro-btns">
      <button class="btn btn-primary" id="btn-start">Answer Yourself →</button>
      <button class="btn btn-ai"     id="btn-ai">🤖 Let Claude Decide</button>
    </div>
  </div>

  <!-- ── LOADING SCREEN ── -->
  <div class="card hidden" id="screen-loading">
    <div class="spinner"></div>
    <div class="loading-label">Analyzing</div>
    <div class="loading-activity-name" id="loading-activity-name"></div>
    <div class="loading-status" id="loading-status">Consulting the sports scholars…</div>
    <div class="loading-error-section hidden" id="loading-error-section">
      <p id="loading-error-msg">⚠️ Analysis failed.</p>
      <div class="loading-error-btns">
        <button class="btn btn-primary" id="btn-try-manual">Answer Manually →</button>
        <button class="btn btn-ai"      id="btn-retry-ai">↺ Try Again</button>
      </div>
    </div>
  </div>

  <!-- ── QUESTION SCREEN ── -->
  <div class="card hidden" id="screen-question">

    <!-- Manual mode: shows activity name badge -->
    <div class="activity-badge hidden" id="q-activity-badge"></div>

    <!-- AI mode: shows Claude badge -->
    <div class="ai-mode-badge hidden" id="ai-mode-badge">🤖 Claude's Analysis</div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="q-progress-label">Question 1 of 10</span>
        <span id="q-yes-count">0 yes</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="dots" id="dots-container"></div>
    </div>

    <span class="q-icon" id="q-icon"></span>
    <div class="q-number" id="q-number">CRITERION 1</div>
    <div class="q-text" id="q-text"></div>

    <!-- Manual answer buttons -->
    <div class="answer-btns" id="answer-btns">
      <button class="btn btn-yes" id="btn-yes">👍 Yes</button>
      <button class="btn btn-no"  id="btn-no">👎 No</button>
    </div>

    <!-- AI reveal section (hidden during manual mode) -->
    <div class="ai-verdict-section hidden" id="ai-verdict-section">
      <div class="ai-verdict-banner" id="ai-verdict-banner"></div>
      <div class="ai-reasoning"      id="ai-reasoning"></div>
    </div>

  </div>

  <!-- ── VERDICT SCREEN ── -->
  <div class="card hidden" id="screen-verdict">
    <span class="verdict-icon" id="verdict-icon"></span>
    <div class="verdict-title" id="verdict-title"></div>
    <div class="verdict-score"  id="verdict-score"></div>
    <div class="ai-credit hidden" id="ai-credit">Determined by Claude 🤖</div>
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle class="score-ring-bg"   cx="60" cy="60" r="50"/>
          <circle class="score-ring-fill" id="ring-fill" cx="60" cy="60" r="50"
            stroke-dasharray="314" stroke-dashoffset="314"/>
        </svg>
        <div class="score-ring-text">
          <span class="big"   id="ring-score">0</span>
          <span class="small">/ 10</span>
        </div>
      </div>
    </div>
    <div class="breakdown"  id="breakdown"></div>
    <button class="btn btn-primary" id="btn-restart-top">Try Another Activity</button>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   Data
───────────────────────────────────────────── */
const QUESTIONS = [
  { icon: '🎯', criterion: 'Criterion 1',  text: 'Does it involve a ball, puck, disc, or similar object central to play?' },
  { icon: '🦘', criterion: 'Criterion 2',  text: 'Does it require leaving the ground — jumping, leaping, or aerial phases?' },
  { icon: '⚠️', criterion: 'Criterion 3',  text: 'Does it carry inherent danger or risk of harm beyond normal exertion?' },
  { icon: '💪', criterion: 'Criterion 4',  text: 'Does it demand significant physical exertion or cardiovascular endurance?' },
  { icon: '⚔️', criterion: 'Criterion 5',  text: 'Does it involve direct competition against opponents?' },
  { icon: '🏆', criterion: 'Criterion 6',  text: 'Does it have standardized, objective scoring or win conditions?' },
  { icon: '🔔', criterion: 'Criterion 7',  text: 'Does it always produce a definitive winner — no ties allowed?' },
  { icon: '🧠', criterion: 'Criterion 8',  text: 'Does it require strategic decision-making or tactics during play?' },
  { icon: '👟', criterion: 'Criterion 9',  text: 'Does it require specialized footwear?' },
  { icon: '🦺', criterion: 'Criterion 10', text: 'Does it have a referee or official who can ruin your day?' },
];

const TIERS = [
  { min: 0,  max: 3,  label: 'Not a Sport', icon: '🚫', ring: '#ff5c5c', tier: 0,
    quip: a => `Sorry — "${a}" doesn't make the cut.` },
  { min: 4,  max: 6,  label: 'Sport',        icon: '✅', ring: '#22d3a0', tier: 1,
    quip: a => `Yep — "${a}" qualifies as a sport.` },
  { min: 7,  max: 9,  label: 'Legit Sport',  icon: '🔥', ring: '#6c63ff', tier: 2,
    quip: a => `"${a}" is a legit sport. Respect.` },
  { min: 10, max: 10, label: 'Elite Sport',  icon: '👑', ring: '#ffd700', tier: 3,
    quip: a => `"${a}" is an elite sport. Peak athleticism.` },
];

const LOADING_MSGS = [
  'Consulting the sports scholars…',
  'Checking rulebooks worldwide…',
  'Analyzing athleticism requirements…',
  'Cross-referencing Olympic criteria…',
  'Running the classification algorithm…',
  'Reviewing historical precedent…',
];

/* ─────────────────────────────────────────────
   State
───────────────────────────────────────────── */
let activity   = '';
let current    = 0;
let answers    = [];
let isAIMode   = false;
let aiAnswers  = [];
let aiReasoning = [];

/* ─────────────────────────────────────────────
   Elements
───────────────────────────────────────────── */
const screenIntro    = document.getElementById('screen-intro');
const screenLoading  = document.getElementById('screen-loading');
const screenQuestion = document.getElementById('screen-question');
const screenVerdict  = document.getElementById('screen-verdict');

const activityInput  = document.getElementById('activity-input');
const btnStart       = document.getElementById('btn-start');
const btnAI          = document.getElementById('btn-ai');
const btnYes         = document.getElementById('btn-yes');
const btnNo          = document.getElementById('btn-no');
const btnRestartTop  = document.getElementById('btn-restart-top');

const answerBtns     = document.getElementById('answer-btns');
const qActivityBadge = document.getElementById('q-activity-badge');
const aiModeBadge    = document.getElementById('ai-mode-badge');
const aiVerdictSection = document.getElementById('ai-verdict-section');
const aiVerdictBanner  = document.getElementById('ai-verdict-banner');
const aiReasoningEl    = document.getElementById('ai-reasoning');

const loadingActivityName = document.getElementById('loading-activity-name');
const loadingStatus       = document.getElementById('loading-status');
const loadingErrorSection = document.getElementById('loading-error-section');
const loadingErrorMsg     = document.getElementById('loading-error-msg');
const btnTryManual        = document.getElementById('btn-try-manual');
const btnRetryAI          = document.getElementById('btn-retry-ai');

const aiCreditEl  = document.getElementById('ai-credit');

/* ─────────────────────────────────────────────
   Utility
───────────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function getActivityValue() {
  const val = activityInput.value.trim();
  if (!val) {
    activityInput.classList.add('shake');
    activityInput.focus();
    setTimeout(() => activityInput.classList.remove('shake'), 500);
    return null;
  }
  return val;
}

/* ─────────────────────────────────────────────
   Screen management
───────────────────────────────────────────── */
function showScreen(el) {
  [screenIntro, screenLoading, screenQuestion, screenVerdict].forEach(s => {
    if (s === el) {
      s.classList.remove('hidden');
      s.classList.remove('fade-out');
      s.classList.add('fade-in');
    } else {
      s.classList.add('hidden');
      s.classList.remove('fade-in');
    }
  });
}

function transitionTo(fn) {
  const active = [screenIntro, screenLoading, screenQuestion, screenVerdict]
    .find(s => !s.classList.contains('hidden'));
  if (!active) { fn(); return; }
  active.classList.add('fade-out');
  setTimeout(() => { fn(); }, 300);
}

/* ─────────────────────────────────────────────
   Dots & Progress
───────────────────────────────────────────── */
function buildDots() {
  const c = document.getElementById('dots-container');
  c.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    c.appendChild(d);
  }
}

function updateDots() {
  for (let i = 0; i < 10; i++) {
    const d = document.getElementById(`dot-${i}`);
    d.className = 'dot';
    if (i < current)        d.classList.add(answers[i] ? 'answered-yes' : 'answered-no');
    else if (i === current) d.classList.add('active');
  }
}

function updateProgress() {
  const pct = (current / 10) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-progress-label').textContent = `Question ${current + 1} of 10`;
  const yesCount = answers.filter(Boolean).length;
  document.getElementById('q-yes-count').textContent = yesCount === 1 ? '1 yes' : `${yesCount} yes`;
}

/* ─────────────────────────────────────────────
   Question renderer
───────────────────────────────────────────── */
function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('q-icon').textContent   = q.icon;
  document.getElementById('q-number').textContent = q.criterion.toUpperCase();
  document.getElementById('q-text').textContent   = q.text;
  updateProgress();
  updateDots();
}

/* ─────────────────────────────────────────────
   Manual Quiz
───────────────────────────────────────────── */
function startManualQuiz() {
  const val = getActivityValue();
  if (!val) return;
  activity   = val;
  current    = 0;
  answers    = [];
  isAIMode   = false;

  transitionTo(() => {
    buildDots();
    // Restore manual UI
    qActivityBadge.textContent = activity;
    qActivityBadge.classList.remove('hidden');
    aiModeBadge.classList.add('hidden');
    answerBtns.classList.remove('hidden');
    aiVerdictSection.classList.add('hidden');
    renderQuestion();
    showScreen(screenQuestion);
  });
}

function answer(yes) {
  answers.push(yes);

  const dot = document.getElementById(`dot-${current}`);
  dot.classList.remove('active');
  dot.classList.add(yes ? 'answered-yes' : 'answered-no');

  current++;

  if (current < 10) {
    screenQuestion.classList.add('fade-out');
    setTimeout(() => {
      renderQuestion();
      screenQuestion.classList.remove('fade-out');
      screenQuestion.classList.add('fade-in');
      setTimeout(() => screenQuestion.classList.remove('fade-in'), 350);
    }, 280);
  } else {
    transitionTo(() => showVerdict());
  }
}

/* ─────────────────────────────────────────────
   AI Quiz
───────────────────────────────────────────── */
async function startAIQuiz() {
  const val = getActivityValue();
  if (!val) return;
  activity  = val;
  current   = 0;
  answers   = [];
  isAIMode  = true;

  // Show loading screen
  loadingActivityName.textContent = `"${activity}"`;
  loadingStatus.textContent = LOADING_MSGS[0];
  loadingErrorSection.classList.add('hidden');
  transitionTo(() => showScreen(screenLoading));

  // Cycle loading messages
  let msgIdx = 0;
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % LOADING_MSGS.length;
    loadingStatus.style.opacity = '0';
    setTimeout(() => {
      loadingStatus.textContent = LOADING_MSGS[msgIdx];
      loadingStatus.style.opacity = '1';
    }, 200);
  }, 2200);

  try {
    const resp = await fetch('/api/analyze', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ activity }),
    });

    clearInterval(msgInterval);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }

    const data = await resp.json();

    if (!Array.isArray(data.answers) || data.answers.length !== 10) {
      throw new Error('Unexpected response from server.');
    }

    aiAnswers   = data.answers;
    aiReasoning = data.reasoning || Array(10).fill('');

    await sleep(400); // brief pause so loading screen doesn't flash
    buildDots();
    transitionTo(() => runAIReveal());

  } catch (err) {
    clearInterval(msgInterval);
    loadingErrorMsg.textContent = `⚠️ ${err.message || 'Analysis failed. Check your API key and server.'}`;
    loadingErrorSection.classList.remove('hidden');
    loadingStatus.textContent = '';
  }
}

async function runAIReveal() {
  // Set up AI mode UI
  qActivityBadge.classList.add('hidden');
  aiModeBadge.classList.remove('hidden');
  answerBtns.classList.add('hidden');
  aiVerdictSection.classList.remove('hidden');

  showScreen(screenQuestion);

  for (let i = 0; i < 10; i++) {
    current = i;

    // Reset reveal elements
    aiVerdictBanner.className = 'ai-verdict-banner';
    aiVerdictBanner.textContent = '';
    aiReasoningEl.className = 'ai-reasoning';
    aiReasoningEl.textContent = '';

    // Transition between questions
    if (i > 0) {
      screenQuestion.classList.add('fade-out');
      await sleep(280);
      screenQuestion.classList.remove('fade-out');
      screenQuestion.classList.add('fade-in');
      await sleep(50);
      screenQuestion.classList.remove('fade-in');
    }

    renderQuestion();

    // Let the question be read
    await sleep(750);

    // Reveal YES / NO with a pop
    const yes = aiAnswers[i];
    aiVerdictBanner.textContent = yes ? '✓  YES' : '✗  NO';
    aiVerdictBanner.classList.add('revealed', yes ? 'yes-verdict' : 'no-verdict');

    // Update tracking state
    answers.push(yes);
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'dot ' + (yes ? 'answered-yes' : 'answered-no');
    const yesCount = answers.filter(Boolean).length;
    document.getElementById('q-yes-count').textContent =
      yesCount === 1 ? '1 yes' : `${yesCount} yes`;
    document.getElementById('progress-fill').style.width = ((i + 1) / 10) * 100 + '%';

    await sleep(380);

    // Reveal reasoning
    if (aiReasoning[i]) {
      aiReasoningEl.textContent = aiReasoning[i];
      aiReasoningEl.classList.add('revealed');
    }

    await sleep(1700);
  }

  // Restore UI before verdict
  aiModeBadge.classList.add('hidden');
  aiVerdictSection.classList.add('hidden');
  answerBtns.classList.remove('hidden');
  qActivityBadge.classList.remove('hidden');

  transitionTo(() => showVerdict());
}

/* ─────────────────────────────────────────────
   Verdict
───────────────────────────────────────────── */
function getTier(score) {
  return TIERS.find(t => score >= t.min && score <= t.max);
}

function showVerdict() {
  const score = answers.filter(Boolean).length;
  const tier  = getTier(score);

  screenVerdict.className = `card fade-in tier-${tier.tier}`;

  document.getElementById('verdict-icon').textContent  = tier.icon;
  document.getElementById('verdict-title').textContent = tier.label;
  document.getElementById('verdict-score').innerHTML   =
    `<strong>${score}</strong> out of 10 — ${tier.quip(activity)}`;
  document.getElementById('ring-score').textContent    = score;

  // Show/hide AI credit line
  if (isAIMode) {
    aiCreditEl.classList.remove('hidden');
  } else {
    aiCreditEl.classList.add('hidden');
  }

  showScreen(screenVerdict);

  // Animate ring
  const circumference = 314;
  const offset = circumference - (score / 10) * circumference;
  const ringEl = document.getElementById('ring-fill');
  ringEl.style.stroke = tier.ring;
  ringEl.style.strokeDashoffset = circumference;
  setTimeout(() => { ringEl.style.strokeDashoffset = offset; }, 50);

  // Build breakdown
  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const yes   = answers[i];
    const item  = document.createElement('div');
    item.className = 'breakdown-item';
    item.style.animationDelay = `${i * 0.05}s`;

    const reasoning = (isAIMode && aiReasoning[i])
      ? `<div class="bi-reasoning">${aiReasoning[i]}</div>` : '';

    item.innerHTML = `
      <span class="bi-num">${i+1}</span>
      <span class="bi-dot" style="background:${yes ? 'var(--yes)' : 'var(--no)'}"></span>
      <span class="bi-label-wrap">
        <span class="bi-label">${q.text}</span>
        ${reasoning}
      </span>
      <span class="bi-answer" style="color:${yes ? 'var(--yes)' : 'var(--no)'}">${yes ? 'YES' : 'NO'}</span>
    `;
    breakdown.appendChild(item);
  });

  if (score >= 7) launchConfetti(tier.ring);
}

/* ─────────────────────────────────────────────
   Restart
───────────────────────────────────────────── */
function restart() {
  isAIMode    = false;
  aiAnswers   = [];
  aiReasoning = [];
  transitionTo(() => {
    activityInput.value = '';
    showScreen(screenIntro);
    activityInput.focus();
  });
}

/* ─────────────────────────────────────────────
   Confetti
───────────────────────────────────────────── */
function launchConfetti(color) {
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = [color, '#fff', '#6c63ff', '#ffd700', '#22d3a0'];
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 200,
    r: 4 + Math.random() * 6,
    d: 2 + Math.random() * 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 360,
    spin: (Math.random() - 0.5) * 6,
    shape: Math.random() > 0.5 ? 'rect' : 'circle',
    w: 6 + Math.random() * 10,
    h: 4 + Math.random() * 8,
  }));

  let frame;
  let ticks = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.tilt * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - ticks / 180);
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      p.y    += p.d;
      p.tilt += p.spin;
      p.x    += Math.sin(ticks * 0.02 + p.r) * 0.8;
    });
    ticks++;
    if (ticks < 200) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  cancelAnimationFrame(frame);
  draw();
}

/* ─────────────────────────────────────────────
   Event Listeners
───────────────────────────────────────────── */
btnStart.addEventListener('click', startManualQuiz);
btnAI.addEventListener('click', startAIQuiz);

activityInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') startManualQuiz();
});

btnYes.addEventListener('click', () => answer(true));
btnNo.addEventListener('click',  () => answer(false));
btnRestartTop.addEventListener('click', restart);

// Error screen actions
btnTryManual.addEventListener('click', () => {
  isAIMode = false;
  transitionTo(() => {
    buildDots();
    qActivityBadge.textContent = activity;
    qActivityBadge.classList.remove('hidden');
    aiModeBadge.classList.add('hidden');
    answerBtns.classList.remove('hidden');
    aiVerdictSection.classList.add('hidden');
    answers  = [];
    current  = 0;
    renderQuestion();
    showScreen(screenQuestion);
  });
});
btnRetryAI.addEventListener('click', startAIQuiz);

// Keyboard shortcuts (manual mode only)
document.addEventListener('keydown', e => {
  if (isAIMode) return;
  if (screenQuestion.classList.contains('hidden')) return;
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'y') answer(true);
  if (e.key === 'ArrowLeft'  || e.key.toLowerCase() === 'n') answer(false);
});
</script>
